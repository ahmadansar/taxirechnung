# Runs on every push and pull request (free for public repos; 2,000 min/month for private ones).
name: CI
on: [push, pull_request]

jobs:
  web:
    name: Types, unit tests, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run sync-shared && npx tsc -b
      - run: npm test
      - run: npm run build   # without Supabase keys → demo build, proves it compiles

  database:
    name: Database (schema, migrations, security)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16 || true
      - run: bash tests/db/run.sh
        env: { DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/postgres' }

  bank-and-einvoice:
    name: Bank matching, FinTS sync, XRechnung validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run sync-shared
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno test --no-check -A tests/bank_test.ts
      - run: cd supabase/functions && deno test --no-check -A bank-sync/sync_test.ts
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install lxml==6.1.3 saxonche==13.1.1 factur-x==7.9
      - run: deno run --no-check --allow-write tests/xr_samples.ts out/xr && python tests/validate_xrechnung.py out/xr/*.xml
